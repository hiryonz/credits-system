<form class="change-status p-32" (ngSubmit)="save()">
  <h2 class="change-status__title mt-0 mb-24">Cambiar estado</h2>

  <span id="change-status-label" class="change-status__label">Nuevo estado *</span>
  <div class="change-status__dropdown mt-8 mb-16">
    <button type="button" class="change-status__trigger px-16" aria-haspopup="listbox" [attr.aria-expanded]="isOpen" aria-labelledby="change-status-label" (click)="toggle()">
      @if (status) {
        <span class="change-status__option-label">
          <span class="change-status__dot change-status__dot--{{ status.toLowerCase() }} mr-12"></span>
          {{ statusLabels[status] }}
        </span>
      } @else {
        <span class="change-status__placeholder">Selecciona un estado</span>
      }
      <svg class="change-status__chevron" [class.change-status__chevron--open]="isOpen" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
    </button>

    @if (isOpen) {
      <div class="change-status__menu py-4" role="listbox" aria-labelledby="change-status-label">
        @for (option of options; track option) {
          <button type="button" role="option" class="change-status__option px-16" [class.change-status__option--selected]="status === option" [attr.aria-selected]="status === option" (click)="select(option)">
            <span class="change-status__option-label">
              <span class="change-status__dot change-status__dot--{{ option.toLowerCase() }} mr-12"></span>
              {{ statusLabels[option] }}
            </span>
            @if (status === option) {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
            }
          </button>
        }
      </div>
    }
  </div>

  <label for="change-status-comment" class="change-status__label">Comentario *</label>
  <textarea id="change-status-comment" class="change-status__field mt-8 p-12" rows="3" name="comment" [(ngModel)]="comment" required placeholder="Explica el motivo del cambio"></textarea>
  <p class="change-status__error mt-4 mb-16">{{ errorMessage }}</p>

  <cs-button text="Guardar" [isLoading]="creditService.isSaving()"></cs-button>
  <button type="button" class="change-status__cancel mt-12 py-12" (click)="cancel()">Cancelar</button>
</form>
