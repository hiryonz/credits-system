<div class="auth" [class.auth--register]="isRegister">
  @if (isRegister) {
    <form class="auth__form auth__form--register p-48" (ngSubmit)="register()">
      <div class="auth__content">
        <h1 class="mb-32">Crear cuenta</h1>
        <div class="mb-16">
          <ion-input label="Usuario" labelPlacement="floating" fill="outline" name="username" [(ngModel)]="username" (ionBlur)="validate('username')"></ion-input>
          <p class="auth__error mt-4 mb-0">{{ errors.username }}</p>
        </div>
        <div class="mb-16">
          <ion-input label="Contraseña" labelPlacement="floating" fill="outline" type="password" name="password" [(ngModel)]="password" (ionBlur)="validate('password')"></ion-input>
        </div>
        <div>
          <ion-input label="Confirmar contraseña" labelPlacement="floating" fill="outline" type="password" name="confirmPassword" [(ngModel)]="confirmPassword" (ionBlur)="validate('confirmPassword')"></ion-input>
        </div>
        <p class="auth__error auth__error--double mt-8 mb-0">{{ errors.password }}</p>
        <cs-button text="Crear cuenta" [isLoading]="authService.isLoading()"></cs-button>
        <p class="mt-24">
          ¿Ya tienes cuenta?
          <button type="button" class="auth__link p-0 ml-4" (click)="toggle()">Iniciar sesión</button>
        </p>
      </div>
    </form>
  } @else {
    <form class="auth__form auth__form--login p-48" (ngSubmit)="login()">
      <div class="auth__content">
        <h1 class="mb-32">Iniciar sesión</h1>
        <div class="mb-16">
          <ion-input label="Usuario" labelPlacement="floating" fill="outline" name="username" [(ngModel)]="username" (ionBlur)="validate('username')"></ion-input>
          <p class="auth__error mt-4 mb-0">{{ errors.username }}</p>
        </div>
        <div>
          <ion-input label="Contraseña" labelPlacement="floating" fill="outline" type="password" name="password" [(ngModel)]="password" (ionBlur)="validate('password')"></ion-input>
          <p class="auth__error auth__error--double mt-4 mb-0">{{ errors.password }}</p>
        </div>
        <cs-button text="Entrar" [isLoading]="authService.isLoading()"></cs-button>
        <p class="mt-24">
          ¿No tienes cuenta?
          <button type="button" class="auth__link p-0 ml-4" (click)="toggle()">Crear cuenta</button>
        </p>
      </div>
    </form>
  }

  <div class="auth__brand py-32">
    <svg width="120" height="120" viewBox="0 0 48 48" aria-hidden="true">
      <rect width="48" height="48" fill="currentColor" />
      <path d="M33 16a11 11 0 1 0 0 16" fill="none" stroke="var(--cs-header)" stroke-width="4" />
      <path d="M25 24h12" stroke="var(--cs-header)" stroke-width="4" />
    </svg>
    <h2 class="mt-24">Crédito Simple</h2>
  </div>
</div>
